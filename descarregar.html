<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Descarregar imatges</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --tx:#1d2330; --mut:#667085; --ac:#2563eb; --bd:#d9dde5; --ok:#16a34a; --er:#dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151c; --card:#1b2030; --tx:#e7eaf2; --mut:#98a2b3; --ac:#60a5fa; --bd:#2f3649; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font:15px/1.45 system-ui,Segoe UI,sans-serif; }
  main { max-width:640px; margin:0 auto; padding:16px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  .sub { color:var(--mut); margin:0 0 16px; }
  section { background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:16px; margin-bottom:16px; }
  h2 { font-size:1.05rem; margin:0 0 10px; }
  label { display:flex; flex-direction:column; font-size:.8rem; color:var(--mut); gap:2px; margin-bottom:10px; }
  input { padding:10px; border:1px solid var(--bd); border-radius:8px; background:var(--bg); color:var(--tx); font:inherit; font-size:16px; }
  button { background:var(--ac); color:#fff; border:0; border-radius:8px; padding:12px 16px; font:inherit; cursor:pointer; min-height:44px; }
  button.sec { background:transparent; color:var(--ac); border:1px solid var(--ac); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:10px 0; }
  .status { color:var(--mut); font-size:.9rem; min-height:1.3em; }
  .status.ok { color:var(--ok); } .status.er { color:var(--er); }
  progress { width:100%; height:14px; }
  table { border-collapse:collapse; width:100%; font-size:.9rem; }
  td, th { padding:4px 8px; border-bottom:1px solid var(--bd); text-align:left; }
  td:last-child, th:last-child { text-align:right; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <h1>Descarregar imatges</h1>
  <p class="sub">Baixa en un ZIP totes les imatges enviades, ordenades en una carpeta per casella (A1/, A2/…).</p>

  <section id="secLogin">
    <h2>Accés d'administrador</h2>
    <form id="frm" autocomplete="on">
      <label>Correu <input id="email" type="email" autocomplete="username" required></label>
      <label>Contrasenya <input id="pass" type="password" autocomplete="current-password" required></label>
      <button id="btnLogin" type="submit">Entrar</button>
    </form>
    <p id="loginInfo" class="status"></p>
  </section>

  <section id="secDl" class="hidden">
    <h2>Imatges al servidor</h2>
    <div class="row">
      <button id="btnList" class="sec">Actualitzar el recompte</button>
      <button id="btnZip" disabled>⬇ Descarregar-ho tot (ZIP)</button>
    </div>
    <progress id="bar" class="hidden" value="0" max="1"></progress>
    <p id="info" class="status"></p>
    <table id="tbl" class="hidden"><thead><tr><th>Casella</th><th>Imatges</th></tr></thead><tbody></tbody></table>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="config.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const cfg = window.UPLOAD_CONFIG || {};
let token = null, files = [];                 // files: [{ path, folder }]

if (!(cfg.url && cfg.anonKey && cfg.bucket)) {
  $('loginInfo').textContent = 'Falta configurar config.js (URL i clau del projecte).'; $('loginInfo').className = 'status er';
  $('btnLogin').disabled = true;
}
const apiHdr = () => ({ apikey: cfg.anonKey, Authorization: 'Bearer ' + token });

/* Entrada: correu i contrasenya d'un usuari de Supabase Auth. La contrasenya no es desa enlloc. */
$('frm').onsubmit = async e => {
  e.preventDefault();
  const info = $('loginInfo'); info.className = 'status'; info.textContent = 'Entrant…';
  try {
    const r = await fetch(`${cfg.url}/auth/v1/token?grant_type=password`, {
      method: 'POST', headers: { apikey: cfg.anonKey, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: $('email').value.trim(), password: $('pass').value })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.access_token) throw new Error(r.status === 400 ? 'Correu o contrasenya incorrectes.' : (j.msg || j.error_description || 'Error ' + r.status));
    token = j.access_token; $('pass').value = '';
    $('secLogin').classList.add('hidden'); $('secDl').classList.remove('hidden');
    await listAll();
  } catch (err) { info.textContent = '⚠ ' + err.message; info.className = 'status er'; }
};

async function list(prefix) {
  const out = [];
  for (let offset = 0; ; offset += 1000) {
    const r = await fetch(`${cfg.url}/storage/v1/object/list/${cfg.bucket}`, {
      method: 'POST', headers: { ...apiHdr(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ prefix, limit: 1000, offset })
    });
    if (!r.ok) throw new Error(`No es pot llistar (${r.status}). Has executat la política de lectura de supabase-setup.sql?`);
    const lot = await r.json(); out.push(...lot);
    if (lot.length < 1000) return out;
  }
}

async function listAll() {
  const info = $('info'); info.className = 'status'; info.textContent = 'Llegint la llista…'; $('btnZip').disabled = true;
  try {
    files = [];
    const counts = {};
    for (const f of await list('')) {
      if (f.id !== null) continue;                               // les entrades sense id són carpetes
      const inside = (await list(f.name + '/')).filter(x => x.id !== null);
      counts[f.name] = inside.length;
      inside.forEach(x => files.push({ folder: f.name, path: `${f.name}/${x.name}` }));
    }
    const names = Object.keys(counts).sort((a, b) => a.length - b.length || a.localeCompare(b));
    $('tbl').classList.toggle('hidden', !names.length);
    $('tbl').querySelector('tbody').innerHTML = names.map(n => `<tr><td>${n}</td><td>${counts[n]}</td></tr>`).join('');
    info.textContent = files.length ? `${files.length} imatges en ${names.length} caselles.` : 'Encara no hi ha cap imatge.';
    info.className = 'status ok'; $('btnZip').disabled = !files.length;
  } catch (e) { info.textContent = '⚠ ' + e.message; info.className = 'status er'; }
}
$('btnList').onclick = listAll;

$('btnZip').onclick = async () => {
  if (!files.length) return;
  const info = $('info'), bar = $('bar'), zip = new JSZip();
  $('btnZip').disabled = $('btnList').disabled = true; bar.classList.remove('hidden'); bar.max = files.length; bar.value = 0;
  let done = 0, i = 0; const errors = [];
  const worker = async () => {
    while (i < files.length) {
      const f = files[i++];
      try {
        const r = await fetch(`${cfg.url}/storage/v1/object/${cfg.bucket}/${f.path}`, { headers: apiHdr() });
        if (!r.ok) throw new Error(r.status);
        zip.file(f.path, await r.arrayBuffer());                 // carpeta/nom.png
      } catch (e) { errors.push(f.path); }
      bar.value = ++done; info.textContent = `Baixant… ${done}/${files.length}`; info.className = 'status';
    }
  };
  try {
    await Promise.all(Array.from({ length: 6 }, worker));
    info.textContent = 'Creant el ZIP…';
    const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' });   // PNG ja està comprimit
    const d = new Date(), p = n => String(n).padStart(2, '0');
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `caselles_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.zip`;
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    info.textContent = errors.length ? `⚠ ZIP creat amb ${files.length - errors.length} imatges; han fallat ${errors.length}.` : `✓ ZIP creat amb ${files.length} imatges.`;
    info.className = 'status ' + (errors.length ? 'er' : 'ok');
  } catch (e) { info.textContent = '⚠ ' + e.message; info.className = 'status er'; }
  $('btnZip').disabled = $('btnList').disabled = false; bar.classList.add('hidden');
};
</script>
</body>
</html>
